name: Daily USA Swimming refresh

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-refresh.yml"
      - "data/swimmers.json"
      - "scripts/build-public-lite.mjs"
      - "scripts/refresh-from-usa-event-rank.mjs"
  schedule:
    # 7 AM Pacific during daylight-saving time. GitHub cron schedules use UTC.
    - cron: "0 14 * * *"

permissions:
  contents: write

concurrency:
  group: daily-usa-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh USA Swimming Event Rank data
        run: node scripts/refresh-from-usa-event-rank.mjs

      - name: Rebuild public dashboard
        run: node scripts/build-public-lite.mjs

      - name: Validate age groups before publish
        run: node scripts/validate-age-groups.mjs

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/swimmers.json data/usa-event-rank-status.json
          if git diff --cached --quiet; then
            echo "No ranking changes to commit."
          else
            git commit -m "Daily USA Swimming refresh"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              echo "Push failed on attempt ${attempt}; retrying after fetching latest main."
              sleep 5
            done
            echo "Unable to push refreshed dashboard after 3 attempts."
            exit 1
          fi
