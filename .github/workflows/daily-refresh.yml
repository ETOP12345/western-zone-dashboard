name: Daily USA Swimming refresh

on:
  workflow_dispatch:
  schedule:
    # 7 AM Pacific during daylight-saving time. GitHub cron schedules use UTC.
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Save previous dashboard snapshot
        run: cp index.html /tmp/wz-previous-index.html

      - name: Refresh USA Swimming Event Rank data
        run: node scripts/refresh-from-usa-event-rank.mjs

      - name: Rebuild public dashboard
        run: node scripts/build-public-lite.mjs

      - name: Validate age groups before publish
        run: node scripts/validate-age-groups.mjs

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/swimmers.json data/usa-event-rank-status.json
          if git diff --cached --quiet; then
            echo "No ranking changes to commit."
          else
            git commit -m "Daily USA Swimming refresh"
            git push
          fi

      - name: Email Ethan rank changes
        env:
          PREVIOUS_DASHBOARD: /tmp/wz-previous-index.html
          CURRENT_DASHBOARD: index.html
          REPORT_URL: https://jialiu103.github.io/western-zone-dashboard/
          EMAIL_TO: liujiauestc@gmail.com
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node scripts/notify-ethan-rank-change.mjs
