name: Daily USA Swimming refresh

on:
  workflow_dispatch:
  schedule:
    # 7 AM Pacific during daylight-saving time. GitHub cron schedules use UTC.
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh USA Swimming Individual Times data
        run: node scripts/refresh-from-usa-individual-times.mjs

      - name: Rebuild public dashboard
        run: node scripts/build-public-lite.mjs

      - name: Commit refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/swimmers.json data/usa-individual-times-status.json
          if git diff --cached --quiet; then
            echo "No ranking changes to commit."
          else
            git commit -m "Daily USA Swimming refresh"
            git push
          fi
